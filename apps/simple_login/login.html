<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - シンプルログイン</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="screen">
            <h1>ログイン</h1>
            <form id="loginForm">
                <div class="form-group floating-group">
                    <input type="text" id="username" placeholder=" " required>
                    <label for="username">ユーザー名</label>
                </div>
                <div class="form-group floating-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">パスワード</label>
                        <button type="button" class="password-toggle-btn" aria-label="パスワード表示切り替え">
                            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">ログイン</button>
                <button type="button" id="backBtn">戻る</button>
            </form>
            <p id="message" class="message"></p>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>

</html>
